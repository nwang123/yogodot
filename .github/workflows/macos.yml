name: Build macOS apps
on:
  push:
    branches: [main, macos]
    tags: ['mac-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify architecture
        run: test "$(uname -m)" = '${{ matrix.arch }}'
      - name: Build and test
        run: ./build-macos.sh
      - name: Test packaged service
        run: .buildenv/bin/python macos/smoke_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: YogoDot-macos-${{ matrix.arch }}
          path: dist/YogoDot-macos-${{ matrix.arch }}.zip
  release:
    if: startsWith(github.ref, 'refs/tags/mac-v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release mac]'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: packages
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            release_tag="mac-v$(cat macos/VERSION)"
          fi
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$release_tag" packages/*.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$release_tag" packages/*.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "YogoDot macOS $release_tag" --notes "macOS 13+. Download arm64 for Apple Silicon or x86_64 for Intel. 32 new pixel designs (80 total). Ad-hoc signed; not notarized. Real keyboard verification is pending. See README for setup and limitations."
          fi
